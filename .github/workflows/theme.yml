name: Theme checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: site.css is up to date
        run: sh tools/build-css.sh && git diff --exit-code assets/css/site.css
      - name: Only min-width media queries
        run: "! grep -rn 'max-width:' assets/css/tokens.css assets/css/base.css assets/css/layout.css assets/css/components.css | grep '@media'"
      - name: Indonesian translation files are up to date
        run: python3 tools/i18n/build.py && git diff --exit-code languages modules/rbx-data/languages modules/rbx-tools/languages
      - name: Game data CSVs are valid
        run: python3 tools/data/check.py
      - name: Guides match the game data
        run: python3 tools/guides/check.py
      - name: Guide queue and draft-link test
        run: php modules/rbx-data/tests/guides.test.php
      - name: Calculator PHP/JS parity
        run: RBX_DATA_DIR=modules/rbx-data node --test modules/rbx-tools/tests/parity.test.mjs
      - name: Report form personal-data check
        run: php modules/rbx-data/tests/report-pii.test.php
      - name: Players confirm vote rule
        run: php modules/rbx-data/tests/votes.test.php
      - name: No eval or innerHTML in calculator JS
        run: "! grep -rnE 'eval\\(|new Function|innerHTML' modules/rbx-tools/assets/js"
