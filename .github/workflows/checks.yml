name: rbx-data checks
on:
  push:
    branches: [rbx-data]
  pull_request:
    branches: [rbx-data]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
